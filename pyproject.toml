[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-research-assistant"
version = "0.1.0"
description = "AI-powered investment research platform: automated company due diligence with source attribution."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=61",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["core", "collectors", "processors", "llm", "llm.providers", "analysis", "orchestration", "reports", "api"]

[tool.setuptools.package-data]
reports = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
files = ["core", "collectors", "processors", "llm", "analysis", "orchestration", "reports", "api"]

[[tool.mypy.overrides]]
module = "weasyprint"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit real external APIs (excluded from CI)",
]
addopts = "-m 'not live'"
