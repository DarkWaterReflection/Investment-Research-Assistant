name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ira:ci .
      - name: Smoke test container
        run: |
          docker run -d --rm -p 8080:8080 --name ira ira:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/health | grep '"status":"ok"'
          curl -sf http://localhost:8080/ | grep -i '<title>Investment Research Assistant</title>'
          curl -sf http://localhost:8080/metrics | grep ira_jobs_total
          docker stop ira
